[project]
name = "telenotify-tui"
version = "0.1.0"
description = "Terminal screen for tele-notify: dashboard, review queue, search, settings"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["textual>=8.2,<9", "python-bidi>=0.6,<0.7", "arabic-reshaper>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.17.5"]

[project.scripts]
telenotify-tui = "telenotify_tui.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telenotify_tui*"]

[tool.setuptools.package-data]
telenotify_tui = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
