<!doctype html><html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />  <title>Marketing Lead | Digital Zone | Jobs by Workable</title>                       <meta name="msapplication-TileImage" content="https://workablehr-ui.s3.amazonaws.com/job-board/assets/ms-icon-144x144.png" />    <script type="application/ld+json"> {"@context":"https://schema.org/","@type":"JobPosting","title":"Marketing Lead","description":"<p>Digital Zone is a fast-growing digital payments and voucher platform, active in Iraq and expanding into Saudi Arabia and the UAE. We operate across gaming, telco, streaming, e-commerce, and live events, and we’re building the marketing team to match our ambitions. </p><p>We’re looking for Marketing Lead to own marketing campaigns and marketing execution for Iraq, translating growth and business priorities into compelling, well-run marketing programs. You’ll lead a team of Senior Marketing Managers, set the standard for how campaigns are planned and delivered, and act as the connective tissue between growth, brand, creative, and the wider business. </p><p>What You’ll Do</p><p>Marketing Strategy &amp; Leadership</p><p>– Own the marketing strategy and annual/quarterly marketing calendar across for Iraq </p><p>– Translate business and growth objectives into marketing plans with clear KPIs and budgets </p><p>– Set the bar for campaign quality, brand consistency, and creative standards across all output </p><p>– Represent marketing in senior leadership discussions, budget planning, and cross-functional planning </p><p>Team Management </p><p>– Lead, coach, and develop a team of Senior Marketing Executives across brand, campaigns, and channels </p><p>– Set individual and team goals, run regular reviews, and build a strong bench of marketing talent </p><p>– Partner closely with the Creative Lead and design/content resources to brief and land campaigns </p><p>– Build and scale marketing processes, workflows, and ways of working as the team grows </p><p>Campaign &amp; Brand Execution </p><p>– Oversee end-to-end campaign execution, from brief to launch to post-campaign review </p><p>– Ensure brand consistency and quality across all consumer touchpoints and markets </p><p>– Own go-to-market plans for new products, features, and market launches </p><p>– Adapt regional and global campaign strategy for local market nuances (Iraq, KSA, UAE)</p><p>Cross-Functional Collaboration </p><p>– Work closely with external partneres, Product, BD to align marketing with the wider roadmap </p><p>– Partner with data/analytics to track campaign performance and marketing ROI </p><p>– Manage relationships with external agencies, media partners, and vendors as needed</p>\n<p>Must-Haves </p><p>– 8–12 years in marketing, with several years in a leadership or head-of-marketing capacity </p><p>– Track record of building and leading marketing teams, ideally in high-growth or consumer tech/app businesses </p><p>– Strong grasp of brand, campaign, and go-to-market strategy end-to-end </p><p>– Experience managing budgets, agencies, and multi-market campaigns </p><p>– Comfortable operating both strategically and hands-on when needed </p><p>– Strong stakeholder management and cross-functional collaboration skills </p><p>– Arabic and English speaker </p><p>– Iraq-based</p><p> Nice to Have </p><p>– Experience in gaming, telco, fintech, or e-commerce categories </p><p>– Familiarity with markets (Iraq, KSA, UAE) </p><p>– Experience working alongside a growth/performance marketing team</p>\n<ul><li>Immediate, large-scale impact on a high-growth business</li><li>Top-of-the-market compensation packages</li><li>Work alongside top regional talent, with team members from Talabat, Careem, Etisalat, and more</li></ul>","identifier":{"@type":"PropertyValue","name":"id","value":"cf6a563f-828b-46ff-9abe-ba015a93fe53"},"datePosted":"2026-11-17T15:14:31.765Z","employmentType":"F deally in high-growth or consumer tech/app businesses </p><p>– Strong grasp of brand, campaign, and go-to-market strategy end-to-end </p><p>– Experience managing budgets, agencies, and multi-market campaigns </p><p>– Comfortable operating both strategically and hands-on when needed </p><p>– Strong stakeholder management and cross-functional collaboration skills </p><p>– Arabic and English speaker </p><p>– Iraq-based</p><p> Nice to Have </p><p>– Experience in gaming, telco, fintech, or e-commerce categories </p><p>– Familiarity with markets (Iraq, KSA, UAE) </p><p>– Experience working alongside a growth/performance marketing team</p>","url":"https://jobs.workable.com/view/rBwyYa9DZC2rUGyCY5Ldqk/hybrid-marketing-lead-in-baghdad-at-digital-zone"} </script>   <meta name="version" content="ui.v2026.42.0-pre.2"><meta name="bundler" content="rspack"><meta name="description" content="Digital Zone is a fast-growing digital payments and voucher platform, active in Iraq and expanding into Saudi Arabia and the UAE. We operate across gaming, telco, streaming, e-commerce, and live events, and we’re building the marketing team to match ou..." data-rh><meta property="og:type" content="website"><meta property="og:title" content="Marketing Lead | Digital Zone | Jobs by Workable" data-rh><meta property="og:description" content="Digital Zone is a fast-growing digital payments and voucher platform, active in Iraq and expanding into Saudi Arabia and the UAE. We operate across gaming, telco, streaming, e-commerce, and live events, and we’re building the marketing team to match ou..." data-rh><meta property="og:url" content="https://jobs.workable.com/view/rBwyYa9DZC2rUGyCY5Ldqk/hybrid-marketing-lead-in-baghdad-at-digital-zone"><meta property="og:image" content="https://workablehr.s3.amazonaws.com/uploads/account/open_graph_logo/737609/social" data-rh><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@workable"><meta name="twitter:title" content="Mar
