<html><head><title>Drilling Fluids Engineer with ref. 5748 · mselect</title>
<script type=application/ld+json>{"@context":"http://schema.org/","@type":"JobPosting","title":"Drilling Fluids Engineer","description":"\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003e\u003cstrong\u003emselect\u003c/strong\u003e is looking to hire a \u003cstrong\u003eDrilling Fluids Engineer\u003c/strong\u003e for an oil and gas operator in \u003cstrong\u003eMaysan, Iraq\u003c/strong\u003e. Candidates must have 5–7 years of relevant experience, with strong expertise in rheology, hydraulics, and hole-cleaning modelling, as well as knowledge of all types of drilling and workover fluids. Fluency in English is a must, and Arabic is an advantage. \u003cbr\u003e\n\u003cbr\u003e\n\u003cstrong\u003eJob Summary\u003c/strong\u003e\u003cbr\u003e\nActs as the company representative for all drilling and completion fluid design and execution at the site. Supervises and quality-controls the fluids contractor and personnel, ensuring fluids meet programme requirements and applicable company standards. May support tendering activities from the Erbil head office. Reports directly to the onsite Drilling Supervisor and Drilling Superintendent.\u003cbr\u003e\n\u003cbr\u003e\n\u003cstrong\u003eKey Responsibilities\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\n\u003cul\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eFluid System Design: Selecting and optimising fluid types—including water-based (WBM), oil-based (OBM), synthetic-based (SBM) muds, workover fluids and completion fluids based on the specific geological conditions and well depth\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eReal-Time Monitoring \u0026 Testing: Performing regular \"mud checks\" on the rig to measure density, viscosity, pH, filtration, and chemical properties to ensure compliance with the programme\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eTroubleshooting: Adjusting fluid compositions immediately to resolve issues like lost circulation, tight holes, or unexpected pressure changes\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eHydraulics Modelling: Calculating Equivalent Circulating Density (ECD) and surge/swab pressures to ensure the drilling operation stays within the safe \"pressure window\"\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eInventory \u0026 Logistics: Managing on-site stock of chemicals and additives, forecasting needs, and coordinating with supply teams to ensure no downtime due to lack of materials\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eHSE \u0026 Environmental Compliance: Ensuring all fluids meet environmental regulations for disposal and that hazardous chemicals are handled safely according to MSDS protocols\u003c/span\u003e\u003c/span\u003e\n\u003c/ul\u003e\n\u003cbr\u003e\n\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003e\u003cstrong\u003eRequirements\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\n\n\u003cul\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eEducation: A Bachelor’s degree in Petroleum Engineering, Chemical Engineering, Geology, or a relevant field; equivalent experience may be considered instead of formal qualifications\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eDrilling \u0026 Workover Fluids: Extensive experience with all types of drilling and workover fluids\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eRheology \u0026 Hydraulics: Advanced knowledge of rheology, hydraulics, and hole-cleaning modelling\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eTraining: Formal mud engineering training with a leading mud services company\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eTechnical Communication: Ability to communicate effectively on technical matters with the onsite drilling team\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eSolids Control: Strong knowledge of solids control optimisation\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eContamination Management: Ability to diagnose contamination issues and implement corrective treatments\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eLost Circulation: Strong knowledge of lost circulation and LCM applications\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eQA/QC \u0026 Data Integrity: Knowledge of QA/QC, equipment calibration, and data integrity\u003c/span\u003e\u003c/span\u003e\n\t\u003cli\u003e\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003eInventory \u0026 Cost Management: Experience with inventory planning and cost tracking\u003c/span\u003e\u003c/span\u003e\n\u003c/ul\u003e\n\u003cbr\u003e\n\u003cbr\u003e\n\u003cspan style=\"font-size: 12.0px;\"\u003e\u003cspan style=\"font-family: Arial , Helvetica , sans-serif;\"\u003e*Only applicants meeting the strict criteria outlined above will be contacted as part of the shortlisting process.\u003c/span\u003e\u003c/span\u003e","identifier":{"@type":"PropertyValue","name":"mselect","value":"5748"},"datePosted":"2026-11-16T15:15:28.345Z","validThrough":"2026-11-25T00:00:00.000Z","employmentType":[],"hiringOrganization":{"@type":"Organization","name":"mselect","sameAs":"https://www.mselect.com"},"baseSalary":{"@type":"MonetaryAmount","currency":null,"value":{"@type":"QuantitativeValue","unitText":"HOUR","minValue":0,"maxValue":0}},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":null,"addressLocality":"Muḩāfaz̧at Maysān","addressRegion":"Muḩāfaz̧at Maysān","postalCode":null,"addressCountry":"IQ"}}}</script>
