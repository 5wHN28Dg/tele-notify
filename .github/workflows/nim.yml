name: nim

on:
  push:
    branches: [main, testing]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tesseract (OCR tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Install dependencies
        run: nimble install -y --depsOnly
      - name: Lint (style check)
        run: for f in src/telenotify.nim tests/t*.nim; do nim check --styleCheck:error "$f" || exit 1; done
      - name: Build
        run: nimble build -y -d:release
      - name: Test
        run: nimble test -y
      - name: Smoke test the CLI
        run: |
          printf 'مطلوب مهندس كهرباء حديث التخرج للعمل في البصرة' > post.txt
          ./telenotify check --config:tests/keywords.json post.txt | tee out.txt
          grep -q "verdict: publish" out.txt
      # the terminal screen (tui/, Python + Textual); after the build, so the
      # tests that run the real filter use this commit's telenotify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TUI lint and tests
        working-directory: tui
        run: |
          python -m pip install -q -e '.[dev]'
          ruff check --target-version py311 .
          python -m pytest -q
      - name: TUI installs with its data files
        run: |
          w=$(mktemp -d); git archive HEAD tui | tar -x -C "$w"
          python -m pip wheel -q --no-deps -w "$w/dist" "$w/tui"
          unzip -l "$w"/dist/*.whl | grep -q 'telenotify_tui/app.tcss'
          echo "the wheel has app.tcss"
